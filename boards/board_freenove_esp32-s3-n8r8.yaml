# http://freenove.com/fnk0085
# Connect to usb near EN/RST, not near BOOT

# https://github.com/Freenove/Freenove_ESP32_S3_WROOM_Board
# https://community.home-assistant.io/t/esp32-s3-wroom-1-n8r8-freenove-camera-board-with-psram-working/815276/2

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: ${esphome_min_version}
  name_add_mac_suffix: False  # this appends to 'name' NOT 'friendly_name'
  # on_loop:
    # - lambda: |-
        # if(id(${id_prefix}_wifi_component).is_connected()) {
          # if (id(${id_prefix}_espcam_update)) {
            # id(${id_prefix}_espcam).update_camera_parameters();
            # if(id(${id_prefix}_debug)) { id(${id_prefix}_espcam).dump_config(); }
            # id(${id_prefix}_espcam_update) = false;
          # }
        # }

  project:
    name: "nliaudat.meter-reader"
    version: "${revision}.dev"
# No platformio_options here: this board builds with the native esp-idf toolchain, where
# PlatformIO options are silently ignored and emit a build warning. In the old block every
# flash/PSRAM/flag key was already commented out, so none of it had any effect; what the
# build needs is expressed natively:
#   extra_flags (-DBOARD_HAS_PSRAM)    -> psram: (declares PSRAM to ESP-IDF)
#   extra_flags (-DTF_LITE_*/-DESP_NN) -> components/tflite_micro_helper/__init__.py (all CPUs)
#   psram_type / memory_type           -> psram.mode: octal, psram.speed: 80MHz
#   board_name, build_flags, hwids, debug.* -> PlatformIO metadata, unused by esp-idf
# Flash mode/frequency were never set for this board (dio / 80MHz = esp-idf default here).

substitutions:
  # board and compilation
  board: freenove_esp32_s3_wroom  # esp32-s3-devkitc-1 # seeed_xiao_esp32s3 # esp32-s3-devkitc-1 # https://github.com/esphome/issues/issues/4492
  framework: esp-idf  # arduino # esp-idf/arduino

  # Pin definition
  external_clock_pin: GPIO15
  external_clock_frequency: 20MHz
  i2c_pins_sda: GPIO4
  i2c_pins_scl: GPIO5
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13
  status_led_pin: GPIO02
  flash_led_pin: GPIO48

esp32:
  board: ${board}
  # toolchain: platformio
  # variant: esp32s3
  cpu_frequency: 240MHZ
  flash_size: 8MB
  framework:
    type: ${framework}
    version: recommended
    sdkconfig_options:
      # CONFIG_COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      CONFIG_TASK_WDT: "y"  # prevents watchdog timeouts
      CONFIG_TASK_WDT_TIMEOUT_S: "30"  # prevents watchdog timeouts
      CONFIG_TASK_WDT_CHECK_IDLE_TASK_CPU0: "n"  # prevents watchdog timeouts
      # ## needed by new jpeg camera : https://github.com/esphome/esphome/pull/9496
      CONFIG_SPIRAM_SUPPORT: y
      CONFIG_SPIRAM_USE_CAPS_ALLOC: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_LOG_DEFAULT_LEVEL: "0"  # prevents "ESP-IDF" Guru Meditation Error
      # CONFIG_LOG_DEFAULT_LEVEL: 0 # prevents "ESP-IDF" Guru Meditation Error
      # CONFIG_CAMERA_TASK_STACK_SIZE: "4096"
      CONFIG_CAMERA_TASK_STACK_SIZE: "8192"
      # ### testing
      # CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_FREERTOS_HZ: "1000"
      CONFIG_ESP32S3_SPIRAM_SUPPORT: y
      CONFIG_SPIRAM_SPEED_80M: y
      # ESP-NN: the optimized S3 kernels are the IDF default and are correct as of
      # esp-nn 1.4.2 (issue #196 fixed). For a slow but bit-exact debug build, add:
      #   CONFIG_NN_ANSI_C: "y"
      #   CONFIG_NN_OPTIMIZED: "n"

      # https://github.com/espressif/esp32-camera/blob/master/examples/camera_example/sdkconfig.defaults
    # CONFIG_ESP32_DEFAULT_CPU_FREQ_240=y
    # CONFIG_ESP32S2_DEFAULT_CPU_FREQ_240=y
    # CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=y

    # CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
    # CONFIG_PARTITION_TABLE_OFFSET=0x10000

    # CONFIG_FREERTOS_HZ=1000
    # CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
    # CONFIG_ESPTOOLPY_FLASHMODE_QIO=y

    # CONFIG_SPIRAM_SUPPORT=y
    # CONFIG_ESP32_SPIRAM_SUPPORT=y
    # CONFIG_ESP32S2_SPIRAM_SUPPORT=y
    # CONFIG_ESP32S3_SPIRAM_SUPPORT=y
    # CONFIG_SPIRAM_SPEED_80M=y

psram:
  mode: octal
  speed: 80MHz

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB  # was: rgb_order: GRB (deprecated in 2026.11)
    pin: ${flash_led_pin}  # GPIO48
    num_leds: 1
    chipset: ws2812
    name: "${name} Flash LED"
    id: ${id_prefix}_flash

    effects:
      - addressable_scan:
          name: "Scan Effect"
          move_interval: 100ms
          scan_width: 1
      - addressable_rainbow:
          name: "Rainbow Effect"
          speed: 10
          width: 50
      - pulse:
          name: "Slow Pulse"
          transition_length: 500ms
          update_interval: 2s
  - platform: status_led
    name: "${name} Status LED"
    id: ${id_prefix}_status_led
    icon: "mdi:alarm-light"
    restore_mode: ALWAYS_OFF
    pin: ${status_led_pin}
