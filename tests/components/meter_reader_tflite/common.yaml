# ESPHome build test: meter_reader_tflite (common)
# Image model via ID reference to tflite_micro_helper entry (new pattern).
# Model is fetched over HTTP at compile time, matching the D:\esphome
# tflite_micro_helper test approach (no local model file required).

external_components:
  - source:
      type: local
      path: ../../../components
    components:
      - meter_reader_tflite
      - value_validator
      - tflite_micro_helper
      - esp32_camera_utils

value_validator:
  id: test_validator

tflite_micro_helper:
  - id: test_digit_model
    model_type: image
    model: "https://raw.githubusercontent.com/nliaudat/esphome_ai_component/refs/heads/main/models/digit_recognizer_v3_quantized_integer_quant_uint8.tflite"

esp32_camera_utils:
  id: test_camera_utils

meter_reader_tflite:
  id: test_meter
  model: test_digit_model
  camera_id: test_camera
  validator: test_validator
  update_interval: 60s
