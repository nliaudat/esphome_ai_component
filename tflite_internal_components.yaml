# INTERNAL `external_components` entries for every config that runs a TFLite
# model on the current (`next`) branch: the project components are compiled
# straight from ./components (no network, no clone, edits in the working tree
# apply on the next `esphome compile`).
#
# Usage (top of the config, e.g. config_prokyber_s3.yaml):
#   external_components: !include tflite_internal_components.yaml
#
# The `external_components:` key is just ESPHome's name for the mechanism, which
# is why this pair of files exists:
#   - tflite_internal_components.yaml : project components from ./components
#   - tflite_external_components.yaml : same layout, documented for the shared
#     include used by the shipped configs
#
# TFLite layout on this branch (the split series #21282-#21288):
#   - meter_reader_tflite is a consumer only; the model is declared once in a
#     `tflite_micro_runtime:` entry and referenced by ID (`model: <runtime_id>`).
#   - tflite_micro_runtime auto-loads the other six components, but those are
#     still only published as PR heads, so each needs its own `source` entry
#     (one ref per source).
#   - tflite_micro_helper (the monolithic predecessor) was removed: image models
#     use tflite_micro_runtime above, and micro_wake_word is the upstream
#     self-contained component. Do not load two TFLite runtimes in one build,
#     they pin different esp-tflite-micro/esp-nn versions.

# 1. Project-only components (local sources).
- source:
    type: local
    path: components
  components:
    - meter_reader_tflite
    - esp32_camera_utils
    - flash_light_controller
    - value_validator
    - data_collector
    - analog_gauge_reader
    - ssocr_reader

# 2. Split TFLite components from their PR heads (upstream esphome/esphome).
- source: github://pr#21282
  components: [tflite_model_source]
  refresh: always
- source: github://pr#21283
  components: [tflite_op_processor]
  refresh: always
- source: github://pr#21284
  components: [tflite_memory_handler]
  refresh: always
- source: github://pr#21285
  components: [tflite_output_processor]
  refresh: always
- source: github://pr#21286
  components: [tflite_model_loader]
  refresh: always
- source: github://pr#21287
  components: [tflite_model_debug]
  refresh: always
- source: github://pr#21288
  components: [tflite_micro_runtime]
  refresh: always
