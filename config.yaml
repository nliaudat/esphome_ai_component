  # - !include components/value_validator/value_validator_controls.yaml
  # - !include components/flash_light_controller/flash_light_controller_controls.yaml
  - !include components/esp32_camera_utils/esp32_camera_utils_controls.yaml
  # - !include data_collector_controls.yaml
  # - !include components/analog_reader/analog_reader_controls.yaml

  # camera configs
  - !include camera_options.yaml
  - !include esp32_camera.yaml
  # - !include camera_webserver.yaml

  # network choice
  - !include wifi.yaml
