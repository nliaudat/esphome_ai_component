# ESPHome build test: camera_image (PR 22766) on the local camera overlay.
esphome:
  name: test-camera-image

external_components:
  - source:
      type: local
      path: ../../../components
    components: [camera]
  - source: github://pr#22766
    components: [camera_image]
    refresh: 1d

logger:
  level: DEBUG

esp32_camera:
  id: test_camera
  name: Test Camera
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_id: camera_i2c
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 640x480
  pixel_format: JPEG

i2c:
  - id: camera_i2c
    sda: GPIO26
    scl: GPIO27
  - id: display_i2c
    sda: GPIO12
    scl: GPIO13

display:
  - platform: ssd1306_i2c
    i2c_id: display_i2c
    id: test_display
    model: SSD1306_128X64
    address: 0x3C

image:
  - platform: camera_image
    id: test_camera_image
    camera_id: test_camera
    format: JPEG
    type: RGB565
    resize: 320x240
    crop:
      x: 0
      y: 0
      width: 200
      height: 100
    rotation: 90
    update_interval: 1s
    on_image:
      - logger.log: "Camera image decoded"
    on_error:
      - logger.log: "Camera image failed"
