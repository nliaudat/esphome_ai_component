# ESPHome build test: camera integration on ESP32-S3
esphome:
  name: test-camera-integration-s3

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y

psram:
  mode: octal
  speed: 80MHz

# S3-safe pinout (the ESP32 defaults in common.yaml use PSRAM/SPI flash pins).
i2c:
  - id: camera_i2c
    sda: GPIO40
    scl: GPIO39
  - id: display_i2c
    sda: GPIO4
    scl: GPIO5

esp32_camera:
  id: test_camera
  name: Test Camera
  external_clock:
    pin: GPIO10
    frequency: 20MHz
  i2c_id: camera_i2c
  data_pins: [GPIO15, GPIO17, GPIO18, GPIO16, GPIO14, GPIO12, GPIO11, GPIO48]
  vsync_pin: GPIO38
  href_pin: GPIO47
  pixel_clock_pin: GPIO13
  resolution: 640x480
  pixel_format: JPEG

<<: !include common.yaml
