  # - !include boards/board_esp32cam_aithinker.yaml #esp32_camera.yaml > power_down_pin must be enabled
  # - !include boards/board_AI-On-The-Edge-Cam_Esp32-S3.yaml

  - !include debug_board.yaml

  # Component-specific controls (comment to disable individual controls)
