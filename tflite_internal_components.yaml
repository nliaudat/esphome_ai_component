# INTERNAL `external_components` entries for every config that runs a TFLite
# model on the current (`dev`) branch: the components are INTERNAL to this repo
# and compiled straight from ./components (no network, no clone, edits in the
# working tree apply on the next `esphome compile`).
#
# Usage (top of the config, e.g. config_prokyber_s3.yaml):
#   external_components: !include tflite_internal_components.yaml
#
# The `external_components:` key is just ESPHome's name for the mechanism, which
# is why this pair of files exists:
#   - tflite_internal_components.yaml : type: local  -> ./components (this file)
#   - tflite_external_components.yaml : type: git    -> GitHub checkout
# Use the external file for configs built outside this clone, or to exercise the
# published `dev`/`main` sources.
#
# All components below are compiled from ./components in this repo:
#   - meter_reader_tflite   : camera -> crop -> inference -> reading pipeline
#   - tflite_micro_helper   : model + runtime holder (declared as a LIST because
#                             it sets MULTI_CONF = True)
#   - esp32_camera_utils, flash_light_controller, value_validator,
#     data_collector, analog_reader, ssocr_reader
#
# NOTE: the `esphome-components` branch uses a different, split layout
# (tflite_micro_runtime + tflite_model_source + ... fetched from the upstream
# PR heads #21282-#21288) and needs its own include file. Configs written for
# that layout declare `tflite_micro_runtime:` and must be migrated to
# `tflite_micro_helper:` before they can build here.

- source:
    type: local
    path: components
  components:
    - meter_reader_tflite
    - tflite_micro_helper
    - esp32_camera_utils
    - flash_light_controller
    - value_validator
    - data_collector
    - analog_reader
    - ssocr_reader
