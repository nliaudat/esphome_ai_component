# ESPHome build test: esp32_camera_utils on ESP32-S3
esphome:
  name: test-camera-utils-s3

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: ../../../components
    components: [esp32_camera_utils]

logger:
  level: DEBUG

# S3-safe pinout (the ESP32 defaults use PSRAM/SPI flash pins on this variant).
esp32_camera:
  id: test_camera
  name: Test Camera
  external_clock:
    pin: GPIO10
    frequency: 20MHz
  i2c_pins:
    sda: GPIO40
    scl: GPIO39
  data_pins: [GPIO15, GPIO17, GPIO18, GPIO16, GPIO14, GPIO12, GPIO11, GPIO48]
  vsync_pin: GPIO38
  href_pin: GPIO47
  pixel_clock_pin: GPIO13
  resolution: 640x480
  pixel_format: JPEG
  # Native window, in `resolution` pixels.
  window:
    offset_x: 0
    offset_y: 0
    width: 320
    height: 240

esp32_camera_utils:
  id: test_camera_utils
  camera_id: test_camera
  rotation: 90
  scaler:
    width: 224
    height: 224
  cropper:
    width: 224
    height: 224
    offset_x: 0
    offset_y: 0
