# ## enable power_down_pin in esp32_camera.yaml, this board needs it

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: ${esphome_min_version}
  name_add_mac_suffix: False
  on_boot:
    priority: 999.0
    then:
      - delay: 500ms
  project:
    name: "nliaudat.meter-reader"
    version: "${revision}.dev"
# No platformio_options here: this board builds with the native esp-idf toolchain, where
# PlatformIO options are silently ignored and emit a build warning. Each old key is
# expressed with its native esp32:/esphome: equivalent instead:
#   board_build.f_cpu: 240000000L  -> esp32.cpu_frequency: 240MHZ
#   board_build.f_flash: 40000000L -> esp32.flash_frequency: 40MHZ
#   -DBOARD_HAS_PSRAM              -> psram: (declares PSRAM to ESP-IDF)
#   -DTF_LITE_* / -DESP_NN         -> components/tflite_micro_helper/__init__.py (all CPUs)
#   board_name                     -> PlatformIO metadata, unused by esp-idf
#   #board_build.partitions: huge_app.csv -> esp32.partitions: (was already commented out)

substitutions:
  board: esp32cam
  framework: esp-idf

  # Camera Pins
  external_clock_pin: GPIO0
  external_clock_frequency: 20MHz
  i2c_pins_sda: GPIO26
  i2c_pins_scl: GPIO27
  data_pins:
    - GPIO5   # CAM_D0
    - GPIO18  # CAM_D1
    - GPIO19  # CAM_D2
    - GPIO21  # CAM_D3
    - GPIO36  # CAM_D4
    - GPIO39  # CAM_D5
    - GPIO34  # CAM_D6
    - GPIO35  # CAM_D7
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22

  # Power Down / Reset
  camera_pwdn_pin: GPIO32
  camera_reset_pin: "-1"

  # LED Pins
  status_led_pin: GPIO33
  flash_led_pin: GPIO4

esp32:
  board: ${board}
  # toolchain: platformio
  flash_size: 4MB
  flash_frequency: 40MHZ  # board_build.f_flash: 40000000L
  cpu_frequency: 240MHZ
  framework:
    type: ${framework}
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32_SPIRAM_SUPPORT: y
      # CONFIG_ESP32_SPIRAM_SPEED_40M: y
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_ESP32_DEFAULT_CPU_FREQ_240: y
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      # CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      # CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      CONFIG_FATFS_LFN_STACK: "y"  # to support long file name in sdcard
      CONFIG_TASK_WDT: "y"  # prevents watchdog timeouts
      CONFIG_TASK_WDT_TIMEOUT_S: "30"  # prevents watchdog timeouts
      CONFIG_TASK_WDT_CHECK_IDLE_TASK_CPU0: "n"  # prevents watchdog timeouts
      # ## needed by new jpeg camera : https://github.com/esphome/esphome/pull/9496
      CONFIG_SPIRAM_SUPPORT: y
      CONFIG_SPIRAM_USE_CAPS_ALLOC: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_LOG_DEFAULT_LEVEL: "0"  # prevents "ESP-IDF" Guru Meditation Error
      CONFIG_CAMERA_TASK_STACK_SIZE: "8192"
      # ### testing
      CONFIG_FREERTOS_HZ: "1000"

psram:

light:
  - platform: binary
    output: ${id_prefix}_flash_light_output
    name: "${name} Flash Light"
    id: ${id_prefix}_flash
  - platform: binary
    output: ${id_prefix}_status_led_output
    name: "${name} Status LED"
    id: ${id_prefix}_light

output:
  - platform: gpio
    pin: ${flash_led_pin}
    id: ${id_prefix}_flash_light_output
  - platform: gpio
    pin: ${status_led_pin}
    id: ${id_prefix}_status_led_output
    inverted: true

esp32_camera:
  power_down_pin: ${camera_pwdn_pin}
