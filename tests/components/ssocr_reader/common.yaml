# ESPHome build test: ssocr_reader common config (Alpha)
logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../../../components
    components: [ssocr_reader, esp32_camera_utils, flash_light_controller]

# globals is a built-in ESPHome component required by esp32_camera_utils'
# crop_zone_handler.h include. Declare a minimal instance so the component
# graph loads it and its headers are copied into the build tree.
globals:
  - id: test_global
    type: int
    initial_value: "0"
    restore_value: false

esp32_camera:
  id: test_camera
  name: Test Camera
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 640x480
  pixel_format: JPEG

esp32_camera_utils:
  id: test_camera_utils

ssocr_reader:
  id: test_ssocr
  camera_id: test_camera
  update_interval: 5s
  digit_count: 8
  threshold_level: 128
  value:
    name: Test SSOCR Value
  confidence:
    name: Test SSOCR Confidence
